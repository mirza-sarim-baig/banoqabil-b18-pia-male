<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="loginForm">
      <div class="container">
        <div class="imgWrapper">
          <img
            src="https://media.istockphoto.com/id/2222337533/photo/vertical-selective-focus-shot-of-unrecognizable-man-holding-and-using-smartphone-standing-on.jpg?s=612x612&w=0&k=20&c=8NKVGzgu2vWQ0tS2ujtUgANm2gHM5C5roSP7HDZC6Lw="
            alt="login form image"
          />
        </div>
        <div class="contentWrapper">
          <h1>Welcome to Voltrex</h1>
          <div class="form-fields">
            <div class="btnsWrapper">
              <button class="signup">SIGN UP</button>
              <button>LOGIN IN</button>
            </div>
            <input type="text" placeholder="Enter your email" />
            <input type="text" placeholder="Enter your password" />
            <input type="text" placeholder="Enter your number" />
            <input type="text" placeholder="Enter amount" />
            <label class="terms">
              <input type="checkbox" />
              I have read all the <span>terms & conditions.</span>
            </label>
            <button class="submit-btn">Login In</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
